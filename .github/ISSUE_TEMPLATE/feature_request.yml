name: ✨ Feature Request
description: Request a new feature — Claude will automatically implement it.
title: "[FEAT] "
labels:
  - enhancement
  - "claude: implement"

body:
  - type: markdown
    attributes:
      value: |
        ## 🤖 Claude Agent — Feature Request
        Describe the feature clearly. Claude reads every field when planning the
        implementation. Specific UI descriptions and acceptance criteria will
        produce the best results.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What do you want built?
      placeholder: "e.g. Add a profile screen where users can view and edit their display name, avatar, and bio."
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      placeholder: |
        As a logged-in user,
        I want to view and edit my profile details,
        So that I can personalise my account.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Tick-box list of conditions that must be true for this to be 'done'.
      placeholder: |
        - [ ] Profile screen is accessible from the home screen via the avatar icon
        - [ ] Display name can be edited inline with a 32-character limit
        - [ ] Changes are persisted after app restart
        - [ ] Loading and error states are handled gracefully
    validations:
      required: true

  - type: textarea
    id: ui_description
    attributes:
      label: UI / UX Description
      description: |
        Describe the visual design. Remember the app uses a gradient design system —
        Claude will apply primary/accent gradients automatically. Describe layout,
        component positions, animations, and interactions.
      placeholder: |
        - Full-screen with a deep indigo–violet vertical gradient background
        - Circular avatar at the top (100dp) with a white border ring
        - Edit pencil icon in the bottom-right corner of the avatar
        - Name displayed in 24sp bold white text below the avatar
        - Edit fields appear on tap with a slide-up animation
        - Save button: primary gradient (indigo → violet) with white label

  - type: textarea
    id: technical_notes
    attributes:
      label: Technical Notes
      description: Architecture preferences, existing components to reuse, API endpoints, etc.
      placeholder: |
        - Reuse the existing UserRepository for persistence
        - Avatar upload should use the /api/v1/users/avatar endpoint
        - ViewModel should already exist at ProfileViewModel.kt (if not, create it)

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "🔴 High — blocking other work"
        - "🟡 Medium — needed soon"
        - "🟢 Low — nice to have"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: Your rough guess — Claude will adjust as needed.
      options:
        - "Small (1–2 files)"
        - "Medium (3–5 files)"
        - "Large (6+ files, new screen/flow)"
