name: 🤖 Android CI

# ─────────────────────────────────────────────────────────────────────────────
# Runs on every PR targeting main.
# All three jobs (build, test, lint) MUST pass before auto-merge fires.
# GitHub branch protection should mark all three as required status checks.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Compile ──────────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

  # ── Job 2: Unit Tests ───────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: "**/build/test-results/**/*.xml"
          reporter: java-junit

  # ── Job 3: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results*.html"
          retention-days: 7

  # ── Job 4: Post CI summary ──────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post PR comment with CI status
        uses: actions/github-script@v7
        with:
          script: |
            const build = '${{ needs.build.result }}';
            const test  = '${{ needs.test.result }}';
            const lint  = '${{ needs.lint.result }}';

            const icon = r => r === 'success' ? '✅' : r === 'failure' ? '❌' : '⚠️';
            const allGood = [build, test, lint].every(r => r === 'success');

            const body = [
              `## ${allGood ? '✅ All CI checks passed' : '❌ CI checks failed'}`,
              '',
              `| Check | Status |`,
              `|-------|--------|`,
              `| Build | ${icon(build)} ${build} |`,
              `| Unit Tests | ${icon(test)} ${test} |`,
              `| Lint | ${icon(lint)} ${lint} |`,
              '',
              allGood
                ? '_Auto-merge will proceed. 🚀_'
                : '_Auto-merge is blocked until all checks pass._',
            ].join('\n');

            github.rest.issues.createComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
